<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>zotero-pdf2zh 启动中</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1b1e;
    color: #e8e6e3;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  }
  .card {
    width: 420px;
    padding: 40px 36px;
    background: #25262b;
    border: 1px solid #3a3b41;
    border-radius: 16px;
    text-align: center;
  }
  .logo {
    width: 56px; height: 56px;
    margin: 0 auto 20px;
    border-radius: 14px;
    background: #3C3489;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 700; color: #CECBF6;
  }
  h1 { font-size: 18px; font-weight: 500; margin-bottom: 6px; }
  .sub { font-size: 13px; color: #9a988f; margin-bottom: 28px; }
  .spinner {
    width: 36px; height: 36px;
    margin: 0 auto 18px;
    border: 3px solid #3a3b41;
    border-top-color: #7F77DD;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status { font-size: 14px; margin-bottom: 8px; min-height: 22px; }
  .detail { font-size: 12px; color: #9a988f; min-height: 18px; }
  .bar {
    height: 4px; border-radius: 2px;
    background: #3a3b41;
    margin-top: 24px;
    overflow: hidden;
  }
  .bar > div {
    height: 100%; width: 30%;
    border-radius: 2px;
    background: #7F77DD;
    animation: slide 1.6s ease-in-out infinite;
  }
  @keyframes slide {
    0% { margin-left: -30%; }
    100% { margin-left: 100%; }
  }
  .ok { color: #5DCAA5; }
  .err { color: #F09595; }
  button {
    margin-top: 18px;
    padding: 8px 22px;
    font-size: 13px;
    color: #e8e6e3;
    background: #3C3489;
    border: none; border-radius: 8px;
    cursor: pointer;
    display: none;
  }
  button:hover { background: #534AB7; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">译</div>
  <h1>zotero-pdf2zh Server</h1>
  <div class="sub">正在等待本地翻译服务启动</div>
  <div class="spinner" id="spinner"></div>
  <div class="status" id="status">正在检测服务状态…</div>
  <div class="detail" id="detail"></div>
  <div class="bar"><div></div></div>
  <button id="retryBtn" onclick="location.reload()">重新检测</button>
</div>
<script>
(function () {
  var TARGET = "http://127.0.0.1:8890";
  var HEALTH = TARGET + "/health";
  var TIMEOUT_MS = 5 * 60 * 1000; // 最长等待 5 分钟（首次需创建翻译环境）
  var INTERVAL = 1000;
  var start = Date.now();
  var tries = 0;
  var statusEl = document.getElementById("status");
  var detailEl = document.getElementById("detail");
  var spinnerEl = document.getElementById("spinner");
  var retryBtn = document.getElementById("retryBtn");

  function elapsed() {
    return Math.floor((Date.now() - start) / 1000);
  }

  function check() {
    tries++;
    // no-cors：服务一旦能接受连接即视为就绪（opaque 响应无法读内容，但可判断存活）
    fetch(HEALTH, { mode: "no-cors", cache: "no-store" })
      .then(function () {
        statusEl.innerHTML = '<span class="ok">服务已就绪，正在跳转…</span>';
        detailEl.textContent = "";
        setTimeout(function () { window.location.href = TARGET + "/"; }, 600);
      })
      .catch(function () {
        var s = elapsed();
        if (Date.now() - start > TIMEOUT_MS) {
          spinnerEl.style.display = "none";
          statusEl.innerHTML = '<span class="err">等待超时：服务未在 5 分钟内就绪</span>';
          detailEl.textContent = "请查看 server\\server_console.log 中的报错，或双击「一键启动Server.bat」看终端输出";
          retryBtn.style.display = "inline-block";
          return;
        }
        if (s < 5) {
          statusEl.textContent = "正在等待服务启动…";
        } else if (s < 60) {
          statusEl.textContent = "服务初始化中（环境检查 / 依赖加载）…";
        } else {
          statusEl.textContent = "首次运行可能正在创建翻译环境，请耐心等待…";
        }
        detailEl.textContent = "已等待 " + s + " 秒 · 每 1 秒自动检测 · 端口 8890";
        setTimeout(check, INTERVAL);
      });
  }

  check();
})();
</script>
</body>
</html>
